name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "VERSION file ($VER) must match tag without v prefix ($TAG)"
            exit 1
          fi

      - name: Build release zip
        env:
          VASSALOPS_INSTALLS_PAT: ${{ secrets.VASSALOPS_INSTALLS_PAT }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          STAGING="dist/staging"
          mkdir -p "$STAGING"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='dist' \
            --exclude='config.local.json' \
            --exclude='storage/launch.log' \
            --exclude='storage/app_stdout.log' \
            --exclude='storage/app_stderr.log' \
            --exclude='storage/_dep_check.py' \
            --exclude='storage/runs' \
            --exclude='storage/splash_seen.json' \
            --exclude='storage/reflexes/*.json' \
            ./ "$STAGING/"
          if [ -n "$VASSALOPS_INSTALLS_PAT" ]; then
            python3 tools/inject_release_token.py dist/staging/config.local.json
          else
            echo "VASSALOPS_INSTALLS_PAT secret missing; zip will still build. Product updates work; learning-share stays skipped until the secret is set."
          fi
          (
            cd "$STAGING"
            zip -r "../VassalOps-${VER}.zip" .
          )
          ls -la dist/VassalOps-${VER}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VassalOps-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
