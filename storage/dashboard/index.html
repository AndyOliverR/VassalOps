<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VassalOps</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif; }
        body { background: #1A202C; background-size: cover; background-position: center; color: #E2E8F0; padding: 40px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        .top-nav-bar { position: absolute; top: 20px; right: 25px; display: flex; align-items: center; z-index: 10; }
        .settings-gear-btn { background: transparent; border: none; font-size: 20px; color: #A0AEC0; cursor: pointer; display: flex; align-items: center; }
        .settings-gear-btn:hover { color: #FFFFFF; }
        .settings-panel { position: absolute; top: 0; right: -320px; width: 300px; height: 100vh; background: #2D3748; box-shadow: -1px 0 20px rgba(0,0,0,0.5); z-index: 100; padding: 30px 20px; transition: right 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column; gap: 20px; }
        .settings-panel.open { right: 0; }
        .settings-panel h3 { font-size: 15px; color: #81E6D9; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #4A5568; padding-bottom: 10px; }
        .settings-row { display: flex; flex-direction: column; gap: 6px; }
        .settings-row label { font-size: 12px; color: #A0AEC0; }
        .settings-row input[type="text"] { background: #1A202C; border: 1px solid #4A5568; border-radius: 6px; padding: 8px 12px; color: #FFFFFF; font-size: 14px; outline: none; }
        .settings-row input[type="file"] { font-size: 12px; color: #A0AEC0; margin-top: 4px; }
        .clear-bg-btn { background: #4A5568; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; align-self: flex-start; margin-top: 2px; }
        .clear-bg-btn:hover { background: #718096; }
        .close-settings-btn { background: #319795; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: auto; }
        .close-settings-btn:hover { background: #234E52; }
        #chatStream { flex: 1; overflow-y: auto; padding-right: 10px; margin-top: 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 24px; text-shadow: 1px 1px 3px rgba(0,0,0,0.4); }
        .msg-container { display: flex; flex-direction: column; gap: 6px; animation: fadeIn 0.2s ease-out; }
        .header-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
        .text-row { font-size: 15px; font-weight: 400; line-height: 1.5; color: #EDF2F7; padding-left: 30px; white-space: pre-wrap; }
        .user-color { color: #D6BCFA; }
        .agent-color { color: #81E6D9; }
        .avatar-frame { width: 22px; height: 22px; object-fit: cover; border-radius: 50%; vertical-align: middle; display: inline-block; }
        .controls-capsule { display: flex; align-items: center; background: #2D3748; border-radius: 12px; padding: 6px 16px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .text-input { flex: 1; background: transparent; border: none; outline: none; color: #FFFFFF; font-size: 15px; padding: 12px 6px; }
        .text-input::placeholder { color: #718096; }
        .action-btn { background: transparent; border: none; color: #A0AEC0; font-size: 18px; padding: 8px; cursor: pointer; margin-left: 6px; }
        .action-btn:hover { color: #FFFFFF; }
        .run-btn { background: #319795; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; margin-left: 12px; }
        .run-btn:hover { background: #234E52; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head><body>
    <div class="top-nav-bar">
        <button class="settings-gear-btn" id="toggleSettingsBtn" title="Open Customization Settings">⚙️</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3>Workspace Settings</h3>
        <div class="settings-row">
            <label>User Identity Name:</label>
            <input type="text" id="settingUsername" value="">
        </div>
        <div class="settings-row">
            <label>Upload Account Avatar Photo:</label>
            <input type="file" id="settingUserAvatar" accept="image/*">
        </div>
        <div class="settings-row">
            <label>Set Background Wallpaper Image:</label>
            <input type="file" id="settingBgWallpaper" accept="image/*">
            <button class="clear-bg-btn" id="clearBgBtn">Remove Wallpaper</button>
        </div>
        <button class="close-settings-btn" id="closeSettingsBtn">Save Profile Settings</button>
    </div>

    <div id="chatStream"></div>

    <div class="controls-capsule">
        <input type="text" id="userInputField" class="text-input" placeholder="Type your command..." autocomplete="off">
        <button class="action-btn" id="micButton" title="Simulate Voice Input">🎙️</button>
        <button class="run-btn" id="runButton">Run</button>
    </div>

    <script>
        const chatStream = document.getElementById('chatStream');
        const inputField = document.getElementById('userInputField');
        const runButton = document.getElementById('runButton');
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const clearBgBtn = document.getElementById('clearBgBtn');
        const settingsPanel = document.getElementById('settingsPanel');

        let currentUsername = localStorage.getItem('vassal_user_name') || 'AnDY';
        let currentUserAvatarBase64 = localStorage.getItem('vassal_user_avatar_b64') || '';
        let currentWallpaperBase64 = localStorage.getItem('vassal_wallpaper_b64') || '';

        document.getElementById('settingUsername').value = currentUsername;
        if (currentWallpaperBase64) {
            document.body.style.backgroundImage = `url(${currentWallpaperBase64})`;
        }        toggleSettingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));

        closeSettingsBtn.addEventListener('click', () => {
            currentUsername = document.getElementById('settingUsername').value.trim() || currentUsername;
            localStorage.setItem('vassal_user_name', currentUsername);

            const avatarInput = document.getElementById('settingUserAvatar');
            const wallpaperInput = document.getElementById('settingBgWallpaper');

            if (avatarInput.files && avatarInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserAvatarBase64 = e.target.result;
                    localStorage.setItem('vassal_user_avatar_b64', e.target.result);
                };
                reader.readAsDataURL(avatarInput.files[0]);
            }

            if (wallpaperInput.files && wallpaperInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentWallpaperBase64 = e.target.result;
                    localStorage.setItem('vassal_wallpaper_b64', e.target.result);
                    document.body.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(wallpaperInput.files[0]);
            }
            settingsPanel.classList.remove('open');
        });

        clearBgBtn.addEventListener('click', () => {
            currentWallpaperBase64 = '';
            localStorage.removeItem('vassal_wallpaper_b64');
            document.body.style.backgroundImage = 'none';
        });

                function appendMessage(sender, text, isUser) {
            const container = document.createElement('div');
            container.className = 'msg-container';
            
            let headerHTML = '';
            if (isUser) {
                const avatarImg = currentUserAvatarBase64 ? `<img src="${currentUserAvatarBase64}" class="avatar-frame"> ` : '';
                headerHTML = `<div class="header-row user-color">${avatarImg}${sender}</div>`;
            } else {
                // Attach a clean brand gear wheel icon directly to the chatbot stream header
                headerHTML = `<div class="header-row agent-color"><img src="vassal_icon.ico" class="avatar-frame"> ${sender}</div>`;
            }

            container.innerHTML = `${headerHTML}<div class="text-row">${text}</div>`;
            chatStream.appendChild(container);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        async function handleSend() {
            const text = inputField.value.trim();
            if (!text) return;
            appendMessage(currentUsername, text, true);
            inputField.value = '';
            
            if (window.pywebview && window.pywebview.api) {
                const response = await window.pywebview.api.submit_command(text);
                appendMessage("VassalOps", response, false);
            } else {
                appendMessage("VassalOps", "Hello! How May I help?", false);
            }
        }

        runButton.addEventListener('click', handleSend);
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

        // Request default system profiles from backend on bootstrap initialization
        window.addEventListener('load', async () => {
            if (window.pywebview && window.pywebview.api) {
                const sysProfile = await window.pywebview.api.get_system_identity();
                if (!localStorage.getItem('vassal_user_name')) {
                    currentUsername = sysProfile.username;
                    document.getElementById('settingUsername').value = currentUsername;
                }
                if (!localStorage.getItem('vassal_user_avatar_b64') && sysProfile.avatar) {
                    currentUserAvatarBase64 = sysProfile.avatar;
                }
            }
            appendMessage("VassalOps", `Hello! How May I help?`, false);
        });
    </script>
</body>
</html>
